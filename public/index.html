<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Container Offloading Visibility Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Container Offloading Visibility Report</h2>
      <form class="container-form" id="containerForm">
        <div class="field-container">
          <label for="warehouse">Warehouse:</label>
          <select name="warehouse" id="warehouseSelect" required>
            <option value="" disabled selected>Select Warehouse</option>
            <option value="API">API</option>
            <option value="FKWH">FKWH</option>
            <option value="SPI">SPI</option>
            <option value="DIP1">DIP1</option>
            <option value="RAS">RAS</option>
          </select>
        </div>
        <div class="field-container">
          <label for="poNumbers">PO Numbers:</label>
          <input
            pattern="[0-9, ]+"
            type="text"
            name="poNumbers"
            id="poNumbers"
            required
            placeholder="eg. 100001,100002"
          />
        </div>
        <div class="field-container">
          <label for="containerNumber">Container Number:</label>
          <input
            type="text"
            name="containerNumber"
            id="containerNumber"
            required
          />
        </div>
        <div class="field-container">
          <label for="sealNumber">Seal Number:</label>
          <input type="text" name="sealNumber" id="sealNumber" required />
        </div>
        <div class="field-container">
          <label for="fsaNumber">FSA Number:</label>
          <input type="text" name="fsaNumber" id="fsaNumber" required />
        </div>
        <div class="field-container">
          <label for="numContainers">Number of Containers:</label>
          <input
            type="number"
            name="numOfContainers"
            id="numContainers"
            required
          />
        </div>
        <div class="field-container">
          <label for="receivedDate">Received Date:</label>
          <input
            type="datetime-local"
            name="receivedDate"
            id="receivedDate"
            required
          />
        </div>
        <div class="field-container">
          <label for="offloadedDate">Offloaded Date:</label>
          <input
            type="datetime-local"
            name="offloadedDate"
            id="offloadedDate"
            required
          />
        </div>
        <div class="field-container">
          <label for="returnDate">Return Date:</label>
          <input
            type="datetime-local"
            name="returnDate"
            id="returnDate"
            required
          />
        </div>
      </form>
      <h3>Item Details</h3>
      <form class="item-details-form no-print" onsubmit="handleAddItem(event)">
        <div class="field-container">
          <label for="code">Code</label>
          <input name="code" type="text" required />
        </div>
        <div class="field-container">
          <label for="code">Cartons/Pallet</label>
          <input name="cartonsPerPallet" type="text" required />
        </div>
        <div class="field-container">
          <label for="code">Quantity/Carton</label>
          <input name="quantityPerCarton" type="text" required />
        </div>
        <div class="btn-group">
          <button type="submit" class="primary">Add Item</button>
          <button type="button" class="primary" onclick="handleSend()">
            Send Report
          </button>
        </div>
      </form>
      <table id="itemsTable">
        <tr>
          <th class="no-print"></th>
          <th>Item</th>
          <th>UoM</th>
          <th>Cartons/Pallet</th>
          <th>Quantity/Carton</th>
          <th>Total</th>
        </tr>
      </table>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
