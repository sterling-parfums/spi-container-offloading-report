<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Offloading Visibility Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 900px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        label {
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover {
            background: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Container Offloading Visibility Report</h2>
        <form id="offloadingForm">
            <label for="containerNumber">Container Number:</label>
            <input type="text" id="containerNumber" required>

            <label for="sealNumber">Seal Number:</label>
            <input type="text" id="sealNumber" required>

            <label for="fsaNumber">FSA Number:</label>
            <input type="text" id="fsaNumber" required>

            <label for="numContainers">Number of Containers:</label>
            <input type="number" id="numContainers" required>

            <label for="receivedDate">Received Date:</label>
            <input type="date" id="receivedDate" required>

            <label for="offloadedDate">Offloaded Date:</label>
            <input type="date" id="offloadedDate" required>

            <label for="returnDate">Return Date:</label>
            <input type="date" id="returnDate" required>

            <h3>Item Details</h3>
            <table id="itemsTable">
                <tr>
                    <th>Item Code</th>
                    <th>Material Description</th>
                    <th>UoM</th>
                    <th>Cartons/Pallet</th>
                    <th>Quantity/Carton</th>
                    <th>Total</th>
                </tr>
            </table>
            <button type="button" onclick="addRow()">Add Item</button>
            <button type="button" onclick="generateReport()">Generate Report</button>
        </form>
        <button onclick="printReport()">Print Report</button>
    </div>

    <script>
        function addRow() {
            let table = document.getElementById("itemsTable");
            let row = table.insertRow(-1);
            for (let i = 0; i < 6; i++) {
                let cell = row.insertCell(i);
                if (i < 5) {
                    let input = document.createElement("input");
                    input.type = i === 3 || i === 4 ? "number" : "text";
                    input.oninput = calculateTotal;
                    cell.appendChild(input);
                } else {
                    cell.innerText = "0";
                }
            }
        }

        function calculateTotal() {
            let rows = document.getElementById("itemsTable").rows;
            for (let i = 1; i < rows.length; i++) {
                let cartons = rows[i].cells[3].querySelector("input").value || 0;
                let quantity = rows[i].cells[4].querySelector("input").value || 0;
                rows[i].cells[5].innerText = cartons * quantity;
            }
        }

        function printReport() {
            window.print();
        }
    </script>
</body>
</html>
